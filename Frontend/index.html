<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartHire - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>SmartHire</h2>
        <p>AI Powered Hiring Platform</p>


<form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <div class="password-field">
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <span class="eye-icon eye-open-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M1.6 12c2.2-3.8 6-6 10.4-6s8.2 2.2 10.4 6c-2.2 3.8-6 6-10.4 6s-8.2-2.2-10.4-6z"></path>
                    <circle cx="12" cy="12" r="3.5"></circle>
                </svg>
            </span>
            <span class="eye-icon eye-closed-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M1.6 12c2.2-3.8 6-6 10.4-6s8.2 2.2 10.4 6c-2.2 3.8-6 6-10.4 6s-8.2-2.2-10.4-6z"></path>
                    <circle cx="12" cy="12" r="3.5"></circle>
                    <line x1="4" y1="20" x2="20" y2="4"></line>
                </svg>
            </span>
        </button>
    </div>

    <button type="submit">Login</button>
</form>


    <p class="link">
        Don't have an account? <a href="register.html">Register</a>
    </p>
</div>


</div>
<script src="js/auth.js"></script>
</body>
</html>
